# LitHub CI —— 在 Linux 与 Windows 上做一次最小冒烟检查
#
# ⚠️ **这个 CI 测不到什么**（别把「绿了」当成「流水线通了」）：
#   - **Zotero**：脚本连的是本机 23119 端口的 Zotero 桌面版，CI 里没有这个东西。
#     任何**真会发请求**的脚本一律不跑：apply_to_zotero / fill_meta / intake_pdfs /
#     library_index / link_markdown / migrate_labels / score_library / sync_properties / tidy。
#     （zapi.py 的 import 本身不做 I/O——Server-ID 与密钥都是首次发请求时才取，
#     所以这些脚本在 CI 里能编译、能 import，只是跑起来会连不上。）
#   - **MinerU**（mineru-open-api）：要 token、要传外部服务。
#   - **LLM**：kimi CLI 与 DeepSeek key 都不在 CI 里。
#   - **任何写 state/、papers/、logs/ 的路径，以及所有下载行为。**
#
# 所以「CI 绿」只代表三件事：
#   ① 全部脚本能在 Windows 上编译、能导入；
#   ② 中文（含 GBK 编不出的字符）的读写往返正确；
#   ③ 不依赖外部服务的脚本能正常启动。
# **整条流水线是否跑通，只能在真机上按 docs/windows.md 手工验**——作者没有 Windows 机器。

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    name: smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false          # 一个平台挂了也要看到另一个平台的结果
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 先把这个 job 的「环境底牌」打出来：Windows 上默认编码通常是 cp936，
      # 也就是中文会静默乱码的那个编码——下面的自测就是冲它去的。
      - name: 打印运行环境（诊断用）
        shell: bash
        run: |
          python -VV
          python -c "import locale,sys; print('platform =', sys.platform); print('getpreferredencoding(False) =', locale.getpreferredencoding(False)); print('stdout.encoding =', sys.stdout.encoding); print('utf8_mode =', sys.flags.utf8_mode)"

      # 用 bash：Windows runner 上是 Git Bash，它会替我们展开通配符。
      # PowerShell 不给原生命令展开 *.py，那样传进去的字面量会直接报「找不到文件」。
      # 仓库分成 linux/ 与 windows/ 两份（代码相同），两份都验——能抓出复制时的缺漏。
      - name: py_compile 全部脚本（两个版本都验）
        shell: bash
        run: |
          for d in linux windows; do
            echo "--- $d ---"
            python -m py_compile "$d"/scripts/*.py
          done

      # ── 这一步存在的理由 ──────────────────────────────────────────────
      # CI 里没有 Zotero，所以「真发请求」的代码路径一行都跑不到，编译与 import 全绿
      # 也说明不了它是通的。2026-09-21 漏过一次：zapi 把模块级 SID/KEY 改成惰性
      # `_sid()` / `_key()` 之后，intake_pdfs 里还留着 `zapi.SID`——编译、import、
      # 两个平台的冒烟全过，到真机收编 PDF 时才炸。这步用 AST 把这类引用找出来。
      - name: 静态检查 zapi 的引用（补上「连不上 Zotero」那段盲区）
        shell: bash
        run: |
          python - <<'PY'
          import ast, pathlib, sys

          def module_names(path):
              tree = ast.parse(pathlib.Path(path).read_text(encoding="utf-8"))
              names = {n.name for n in tree.body
                       if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef))}
              for n in tree.body:
                  if isinstance(n, ast.Assign):
                      names |= {t.id for t in n.targets if isinstance(t, ast.Name)}
              return names

          have = module_names("linux/scripts/zapi.py")
          bad, n = [], 0
          for d in ("linux/scripts", "windows/scripts"):
              for f in sorted(pathlib.Path(d).glob("*.py")):
                  n += 1
                  for node in ast.walk(ast.parse(f.read_text(encoding="utf-8"))):
                      if (isinstance(node, ast.Attribute) and isinstance(node.value, ast.Name)
                              and node.value.id == "zapi" and node.attr not in have):
                          bad.append(f"{f}:{node.lineno}  zapi.{node.attr}")

          if bad:
              print("❌ 引用了 zapi.py 里不存在的名字：")
              print("\n".join("   " + b for b in bad))
              sys.exit(1)
          print(f"✅ {n} 个文件、zapi 共 {len(have)} 个模块级名字，引用全部有定义")
          PY

      # ── 本 workflow 存在的理由 ────────────────────────────────────────
      # 断言的写法有意与 locale 默认编码**解耦**：
      # 比的是「落盘的字节」与「读回来的内容」，而不是比两边的字符串是否都「看着对」——
      # 按 cp936 解码出的乱码字符串也是合法字符串，只有比字节才抓得住。
      - name: 中文编码往返自测（含 GBK 编不出的字符）
        shell: bash
        run: |
          python - <<'PY'
          import json, locale, os, pathlib, sys, tempfile

          # 挑的都是 GBK 编不出来的字符：✅ ⚠️ 不在 GB2312/GBK 里。
          # 只挑「结构退化」这种 GBK 也有的一字不差的中文，测不出 cp936 的问题。
          CN = "结构退化·氧活性·界面反应"
          HARD = "✅ ⚠️"
          PAYLOAD = {"primary": CN, "note": CN + " ≤ ≈ → mAh/g " + HARD}
          EXPECTED_BYTES = json.dumps(PAYLOAD, ensure_ascii=False).encode("utf-8")

          pref = locale.getpreferredencoding(False)
          print(f"platform = {sys.platform}")
          print(f"locale.getpreferredencoding(False) = {pref}")
          print(f"sys.flags.utf8_mode = {sys.flags.utf8_mode}")

          d = tempfile.mkdtemp()
          p = os.path.join(d, "classification.json")
          q = pathlib.Path(d) / "manifest.json"

          # ① open()：仓库脚本现在的写法（显式 utf-8）
          with open(p, "w", encoding="utf-8") as f:
              json.dump(PAYLOAD, f, ensure_ascii=False)
          got = open(p, "rb").read()
          assert got == EXPECTED_BYTES, f"落盘字节不是 UTF-8：{got!r}"
          with open(p, encoding="utf-8") as f:
              back = json.load(f)
          assert back == PAYLOAD, f"读回不一致：{back!r}"

          # ② Path.read_text / write_text：同样必须显式 utf-8
          q.write_text(json.dumps({"title": HARD}, ensure_ascii=False), encoding="utf-8")
          assert q.read_bytes() == json.dumps({"title": HARD},
                                              ensure_ascii=False).encode("utf-8")
          assert json.loads(q.read_text(encoding="utf-8"))["title"] == HARD

          # ③ 关键断言：上面两条与 locale 默认编码**无关**——
          #    不管 pref 是 utf-8 还是 cp936，落盘字节恒为 UTF-8、读回恒等值。
          print("① open() 与 ② read_text/write_text 的往返都与默认编码无关 ✓")

          # ④ 反证：确认这台机器确实处在「不显式写 encoding 就会出事」的环境里。
          #    不写成硬断言：Linux 上它不会失败，而未来的 Python 可能把 Windows 默认
          #    也改成 UTF-8（PEP 686），那时硬断言反而会误报。
          if sys.platform.startswith("win"):
              r = os.path.join(d, "default_encoding.txt")
              try:
                  with open(r, "w") as f:          # 故意不写 encoding=
                      f.write(HARD)
                  verdict = "默认编码也写得了 ✅（这台机器不像典型的 cp936 环境）"
              except UnicodeEncodeError as e:
                  verdict = f"默认编码写不了 ✅ → UnicodeEncodeError({e.encoding})"
              print(f"④ 对照（不带 encoding=）：{verdict}")
              print("   ↑ 出现这一行才说明本 job 真的在考「默认编码不是 UTF-8」这件事")
          PY

      # 只跑**确定没有副作用**的路径：argparse 的 --help（在 parse 阶段就退出），
      # 以及 runtime.py 的裸跑（只打印生效配置）。
      # 刻意不跑：所有 import zapi 的脚本（CI 里没有 Zotero）、所有会写 state 的脚本、
      # 任何要网络或要 LLM 的脚本。
      - name: 无副作用启动自检（两个版本都验）
        shell: bash
        run: |
          set -x
          for d in linux windows; do
            echo "--- $d ---"
            for f in doctor daily_digest citation_graph journal_if build_embeddings send_digest; do
              python "$d/scripts/$f.py" --help > /dev/null
            done
            python "$d/scripts/runtime.py" > /dev/null
            python "$d/scripts/doctor.py" --help
          done

      # ── 这一步存在的理由 ──────────────────────────────────────────────
      # 上面那步跑的都是 `--help > /dev/null`：argparse 在 parse 阶段就退出，
      # **测不到控制台编码**——而这正是 Windows 上最容易静默出问题的一环。
      # 2026-09-21 实测（Linux 上用 PYTHONIOENCODING 复现 cp936）：把文献数据原样
      # print 出去会直接崩，`digest.py` 报 `UnicodeEncodeError: 'gbk' codec can't
      # encode character '\xc5'`（标题里的 Å），`sync_properties.py` 报 `'\xf6'`
      # （作者里的 ö）。两个要点别记错：
      #   ① 崩的**不是 emoji，是数据里的非 GBK 字符**（Å / ö / Π 这类），静态扫
      #      脚本里的 ✅ ⚠️ 会高估；② **不只是重定向**，直接打控制台一样崩。
      # 兜底写在 zapi / topic / find_new / sync_properties 四个被 import 的模块里
      # （`sys.stdout.reconfigure(errors="replace")`，import 即生效，与 zapi.py 顶部
      # 那段 IPv4 补丁同一套路），外加不 import 本地模块的几个脚本各自一份。
      # 本步用 PYTHONIOENCODING=cp936 把 Windows 的行为在 Linux 上也复现（cp936 是
      # 内置编码，两个 runner 都有），逐个 import（**不执行 main**）后 print 一段
      # 非 GBK 语料，断言：① 退出码 0；② 输出里不出现 UnicodeEncodeError。
      # 注意本步考的是「整条 import 链上有没有兜底」，不是逐脚本覆盖率——要逐脚本隔离
      # 得一个脚本起一个进程；这里 import 全部之后才 print，第一个装上兜底的模块就会
      # 把错误策略定下来。下面额外断言四个 hub 里至少有一个 import 成功，否则这次
      # print 其实什么都没考。
      # import 本身因缺 state/、缺依赖失败属正常（CI 里没有 Zotero / papers / 令牌），
      # 用 try 包住跳过；**唯独 UnicodeEncodeError 不吞**——那正是本步要抓的。
      - name: 控制台编码冒烟（PYTHONIOENCODING=cp936 下 print 非 GBK 语料）
        shell: bash
        env:
          PYTHONIOENCODING: cp936
        run: |
          set -e
          for d in linux windows; do
            echo "════════ $d ════════"
            out=$(mktemp)
            rc=0
            python - "$d" > "$out" 2>&1 <<'PY' || rc=$?
          import importlib, pathlib, sys

          tree = sys.argv[1]
          sys.path.insert(0, str(pathlib.Path(tree, "scripts")))
          files = sorted(pathlib.Path(tree, "scripts").glob("*.py"))

          # 2026-09-22 起 `sync_classification.py` 把顶层计算与写盘收进了 main()，
          # import 不再重写 `分类与标签总表.md`，所以这步可以覆盖全部脚本。
          # 保留 SKIP 这个机制（空集），以后真遇到「import 即写文件」的脚本再往里加。
          SKIP = set()
          # 装了兜底的模块：至少要有一个真的 import 进来，否则下面的 print 没考到东西
          HUBS = {"zapi", "topic", "find_new", "sync_properties"}
          # 语料刻意含 GBK 编不出的字符：Å(化学元素/作者名里常见) ö Π ✅ ⚠️ ≈ → ℃
          CORPUS = "Å ö Π ✅ ⚠️ ≈ → ℃ 结构退化 LiNi0.8Co0.1Mn0.1O2 mAh/g"

          ok, skipped, hubs_ok = 0, [], []
          for f in files:
              if f.name in SKIP:
                  skipped.append(f"{f.name}(writes a file at import)")
                  continue
              try:
                  importlib.import_module(f.stem)
                  ok += 1
                  if f.stem in HUBS:
                      hubs_ok.append(f.stem)
              except UnicodeEncodeError:
                  raise                     # ← 本步唯一要抓的错误，绝不吞
              except BaseException as e:     # 缺 state/ 缺依赖等都算正常，跳过
                  skipped.append(f"{f.name}({e.__class__.__name__})")

          # 下面这些行**只用 ASCII 打印**：本步把 stdout 钉成了 cp936，中文打出来在
          # GitHub 的 UTF-8 日志里是乱码；更要紧的是，一旦兜底没了，print 本身就可能抛
          # UnicodeEncodeError，那会把「hub 没导入」的真正原因淹掉。
          print(f"imported {ok}/{len(files)} scripts, skipped {len(skipped)}:")
          for s in skipped:
              print(f"  - {s}")
          if not hubs_ok:
              print(f"ERROR: none of {sorted(HUBS)} could be imported -- "
                    f"the import chain that installs the fallback was not exercised")
              sys.exit(2)
          print(f"guard-bearing modules loaded: {', '.join(sorted(hubs_ok))}")
          print(f"sys.stdout.encoding={sys.stdout.encoding} errors={sys.stdout.errors}")
          print("--- corpus (non-GBK chars must degrade to '?', never raise) ---")
          print(CORPUS)
          print("--- end of corpus ---")
          PY
            cat "$out"
            if [ "$rc" -ne 0 ]; then
              echo "❌ $d: 退出码 $rc（要求 0）"; rm -f "$out"; exit 1
            fi
            if grep -q "UnicodeEncodeError" "$out"; then
              echo "❌ $d: 输出里出现 UnicodeEncodeError——控制台编码兜底丢了吗？"
              rm -f "$out"; exit 1
            fi
            rm -f "$out"
            echo "✅ $d: 退出码 0，输出里没有 UnicodeEncodeError"
          done
